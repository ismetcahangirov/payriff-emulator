name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Typecheck, test, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run typecheck
      - run: pnpm test
      - run: pnpm run build

  docker:
    name: Docker image
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t payriff-emulator .
      - name: Smoke test the image
        run: |
          docker run -d --name emulator -p 4010:4010 payriff-emulator
          for i in $(seq 1 30); do curl -fs http://localhost:4010/health && break; sleep 1; done
          curl -fs -H 'Authorization: emulator-secret-key' -H 'Content-Type: application/json' \
            -d '{"amount":1.00,"callbackUrl":"https://merchant.test/cb"}' http://localhost:4010/api/v3/orders | grep -q '"code":"00000"'
          docker rm -f emulator
